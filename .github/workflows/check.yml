name: Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: "postgresql://user:password@localhost:5432/test"
      DIRECT_URL: "postgresql://user:password@localhost:5432/test"
      ADMIN_PASSWORD: "test-password-for-ci"
      SESSION_SECRET: "test-secret-for-ci-32-characters-long"
      MY_EMAIL: "test@example.com"
      RESEND_KEY: "re_test_key"
      TELEGRAM_BOT_TOKEN: "1234567890:TEST"
      TELEGRAM_CHAT_ID: "123456789"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run check
        run: npm run check